<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mission Z.4 - Keywords</title>
  <link rel="stylesheet" href="css/keywords.css">
</head>
<body>

<header class="navbar">
  <h2>🧠 Keywords</h2>
  <div>
    <button onclick="goToDashboard()">Dashboard</button>
    <button onclick="goToPractice()">Practice</button>
    <button onclick="toggleTheme()">🌙</button>
  </div>
</header>

<main class="keywords-page">

  <section class="kw-toolbar">
    <div class="kw-search-box">
      <span class="kw-search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search cards, keywords, definitions... (Ctrl+K)" oninput="filterCards()">
    </div>

    <select id="sortSelect" onchange="renderCards()">
      <option value="recent">Recently Updated</option>
      <option value="az">Title A–Z</option>
      <option value="terms">Most Terms</option>
    </select>

    <button class="add-card-btn" onclick="openCardModal()">+ Add Card</button>
  </section>

  <section class="kw-stats">
    <span id="cardCount">0 cards</span>
    <span id="termCount">0 terms total</span>
  </section>

  <section class="kw-grid" id="kwGrid"></section>

  <div class="kw-empty hidden" id="kwEmpty">
    <p>📭 No cards yet</p>
    <span>Click "+ Add Card" to create your first subject card — e.g. "Economic Reforms".</span>
  </div>

</main>

<!-- Add/Edit Modal -->
<div class="modal hidden" id="cardModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">New Card</h3>
      <span class="modal-close" onclick="closeCardModal()">✖</span>
    </div>

    <input type="text" id="cardTitleInput" placeholder="Subject / Topic name (e.g. Economic Reforms)">

    <div class="color-picker" id="colorPicker"></div>

    <textarea id="cardContentInput" placeholder="One per line, in the format:&#10;Term: Definition&#10;&#10;e.g.&#10;Fiscal Deficit: Difference between total revenue and total expenditure of the government&#10;Repo Rate: Rate at which RBI lends money to commercial banks"></textarea>

    <div class="modal-footer">
      <span id="charCount">0 characters</span>
      <button class="save-card-btn" onclick="saveCard()">Save Card</button>
    </div>
  </div>
</div>

<!-- View/Detail Modal -->
<div class="modal hidden" id="viewModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="viewTitle">Title</h3>
      <span class="modal-close" onclick="closeViewModal()">✖</span>
    </div>
    <div class="view-meta" id="viewMeta"></div>
    <div class="kw-term-list" id="viewBody"></div>
    <div class="modal-footer">
      <button class="print-card-btn" onclick="printCard()">🖨 Print</button>
      <button class="edit-card-btn" id="editFromViewBtn">✏ Edit</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/keywords.js"></script>
<script src="js/utils.js"></script>

</body>
</html>
